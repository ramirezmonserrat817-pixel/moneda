<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>conversor de divisas</title>
    <link rel="stylesheet" href="moneda.css">
    <script src="moneda.js" defer></script>
</head>
<body>
<div class="container">
    <h2>Conversor multi divisa</h2>
    <input type="number" id="montoinput" placeholder="cantidad de dolares">
    <br>
    <select id="divisaselect">
        <option value="eur">euros0(eur)</option>
        <option value="mxn">pesos mexicanos(mxn)</option>
        <option value="jpy">yenes(jpy)</option>
    </select>
    <br>
    <button id="btnconvertir">calcular conversion</button>
</div>
</body>
</html>
